# Smithery configuration: https://smithery.ai/docs/build/project-config
name: ghidra-bizhawk-mcp
description: "Unified Ghidra + BizHawk MCP server for static analysis, P-code emulation, multi-console ROM triage, and live emulation."
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      ghidraInstallDir:
        type: string
        description: "Path to your Ghidra installation directory (e.g. /opt/ghidra). Leave blank for mock mode."
      bizhawkExePath:
        type: string
        description: "Optional path to EmuHawk.exe for live emulation. Leave blank for Ghidra-only mode."
      mockMode:
        type: boolean
        default: true
        description: "Enable mock mode for zero-dependency environments (disables Ghidra/BizHawk connections). Enabled by default."
  commandFunction:
    |-
    (config) => ({
      command: 'ghidra-bizhawk-mcp',
      args: [],
      env: {
        GHIDRA_INSTALL_DIR: config.ghidraInstallDir,
        BIZHAWK_EXE_PATH: config.bizhawkExePath || '',
        MOCK_MODE: config.mockMode ? '1' : '0'
      }
    })
  exampleConfig:
    mockMode: true
