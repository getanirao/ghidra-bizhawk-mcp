# Smithery configuration: https://smithery.ai/docs/build/project-config
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - ghidraInstallDir
    properties:
      ghidraInstallDir:
        type: string
        description: "Path to your Ghidra installation directory (e.g. /opt/ghidra or C:\\Program Files\\ghidra_11.2)"
      bizhawkExePath:
        type: string
        description: "Optional path to EmuHawk.exe for live emulation. Leave blank for Ghidra-only mode."
      mockMode:
        type: boolean
        default: false
        description: "Enable mock mode for zero-dependency environments (disables Ghidra/BizHawk connections)"
  commandFunction:
    |-
    (config) => ({
      command: 'ghidra-bizhawk-mcp',
      args: [],
      env: {
        GHIDRA_INSTALL_DIR: config.ghidraInstallDir,
        BIZHAWK_EXE_PATH: config.bizhawkExePath || '',
        MOCK_MODE: config.mockMode ? '1' : '0'
      }
    })
